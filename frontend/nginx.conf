server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Archive files up to 50 MB, documents and punch/Excel files must pass through.
  client_max_body_size 55m;

  add_header X-Content-Type-Options nosniff always;
  # The system runs on its own domain and is never shown inside another site's frame.
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(self)' always;
  # blob: is needed for employee photos and documents loaded with the session token.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-src blob: https://www.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  location /api/ {
    proxy_pass http://api:5000/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ZKTeco ADMS push from fingerprint devices.
  location /iclock/ {
    proxy_pass http://api:5000/iclock/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # No add_header inside locations: nginx would then drop the security headers above.
  location /brand/ {
    expires 7d;
  }

  # The service worker and manifest must always be fresh so new releases reach installed apps.
  location = /sw.js {
    expires -1;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 1h;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
