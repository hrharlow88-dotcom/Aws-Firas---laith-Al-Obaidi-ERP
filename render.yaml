# Demo only: the free plan's disk is wiped on every deploy and its database expires.
# Never load real salaries or ID numbers here; use deploy/ on the company server.
services:
  - type: web
    name: laith-erp-demo
    runtime: node
    plan: free
    region: frankfurt
    # Dev dependencies (TypeScript, Vite) are needed to build even though NODE_ENV is production.
    buildCommand: cd backend && npm ci --include=dev && npm run build && cd ../frontend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: laith-erp-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: laith-erp-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: laith-erp-demo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: laith-erp-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: laith-erp-demo-db
          property: password
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # Render generates a base64 256-bit value, the format the field encryption expects.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: UPLOAD_DIR
        value: /tmp/laith-erp-uploads
      - key: ADMIN_NAME
        value: مسؤول النظام
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: laith-erp-demo-db
    databaseName: laith_erp
    user: laith_erp_app
    plan: free
    region: frankfurt
    ipAllowList: []
