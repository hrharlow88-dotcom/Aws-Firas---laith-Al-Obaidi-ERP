{% extends 'layout.html' %}
{% block body %}
  <h2>{{ i18n.t('upload_excel') }}</h2>
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".xlsx,.xls"><br><br>
    <button type="submit">{{ i18n.t('upload_excel') }}</button>
  </form>
  <p><a href="/?lang={{ lang }}">{{ i18n.t('back_to_dashboard') }}</a></p>
{% endblock %}
