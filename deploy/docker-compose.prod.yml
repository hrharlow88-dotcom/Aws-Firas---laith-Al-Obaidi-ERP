# Production stack for the company's own server.
#   cd deploy && ./install.sh          (first time: writes .env, starts everything)
#   docker compose -f docker-compose.prod.yml up -d --build   (after an update)
#
# Internet → caddy (HTTPS, automatic certificate) → web (nginx: app + /api) → api → database
# Fingerprint devices → caddy :8081 (plain HTTP, /iclock only) → web → api
name: laith-erp

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # caddy → nginx → api
      TRUST_PROXY_HOPS: "2"
      PUBLIC_URL: https://${ERP_DOMAIN}
      # Link to the separate demo copy (set by ./new-company.sh ... --demo)
      DEMO_BRIDGE_URL: ${DEMO_BRIDGE_URL:-}
      DEMO_BRIDGE_KEY: ${DEMO_BRIDGE_KEY:-}
      UPLOAD_DIR: /data/uploads
      SAP_B1_URL: ${SAP_B1_URL:-}
      SAP_B1_COMPANY_DB: ${SAP_B1_COMPANY_DB:-}
      SAP_B1_USER: ${SAP_B1_USER:-}
      SAP_B1_PASSWORD: ${SAP_B1_PASSWORD:-}
      SAP_B1_LOCAL_CURRENCY: ${SAP_B1_LOCAL_CURRENCY:-IQD}
    volumes:
      - uploads:/data/uploads
      # Company workbooks for `import:company` (read-only, never in the image).
      - ./company-data:/import:ro
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?Set ERP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "${DEVICE_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Extra companies started with ./new-company.sh add their site here.
      - ./companies:/etc/caddy/companies:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: database
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/data/uploads:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres:
  uploads:
  caddy-data:
  caddy-config:
