# One more company on the same server: its own database, files, API and web,
# reached through the main Caddy on its own domain. Started by ./new-company.sh.
name: laith-erp-${COMPANY}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY_HOPS: "2"
      PUBLIC_URL: https://${ERP_DOMAIN}
      UPLOAD_DIR: /data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
      edge:
        aliases:
          - web-${COMPANY}

networks:
  edge:
    external: true
    name: laith-erp_default

volumes:
  postgres:
  uploads:
