# One more company on the same server: its own database, files, API and web,
# reached through the main Caddy on its own domain. Started by ./new-company.sh.
name: laith-erp-${COMPANY}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY_HOPS: "3"
      PUBLIC_URL: https://${ERP_DOMAIN}
      UPLOAD_DIR: /data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_BRIDGE_KEY: ${DEMO_BRIDGE_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      database:
        condition: service_healthy

  # Kept off the shared network: there "web" and "api" are the main system's names.
  site:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api

  # The only container on the shared network, under a name no other system uses.
  # It forwards to this copy's own site, so the main Caddy can reach it safely.
  gate:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - site
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          server_tokens off;
          client_max_body_size 55m;
          location / {
            proxy_pass http://site:80;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    networks:
      default:
      edge:
        aliases:
          - web-${COMPANY}

networks:
  edge:
    external: true
    name: laith-erp_default

volumes:
  postgres:
  uploads:
